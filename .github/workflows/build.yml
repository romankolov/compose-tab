name: Build, test and capture
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test libraries and assemble Android and Desktop
        run: ./gradlew :score-model:desktopTest :score-ui:desktopTest :sample:assembleDebug :sample:desktopJar --stacktrace
      - name: Capture real desktop windows
        run: |
          mkdir -p screenshots
          for view in both tab selected; do
            timeout 120s xvfb-run -a -s '-screen 0 1280x900x24' ./gradlew :sample:run --args="--screenshot=$PWD/screenshots/$view.png --view=$view"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: sample/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
  ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sample:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-framework
          path: sample/build/bin/iosSimulatorArm64/debugFramework/
