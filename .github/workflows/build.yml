name: Build, test and capture
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test libraries and assemble Android and Desktop
        run: |
          set -o pipefail
          ./gradlew :score-model:desktopTest :score-ui:desktopTest :sample:assembleDebug :sample:desktopJar --stacktrace 2>&1 | tee build-log.txt
      - name: Report build failure on PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### CI diagnostics: Desktop / Android'; echo '```text'; tail -150 build-log.txt; echo '```'; } > diagnostic.md
          gh pr comment 1 --body-file diagnostic.md
      - name: Capture real desktop windows
        run: |
          mkdir -p screenshots
          for view in both tab selected; do
            timeout 120s xvfb-run -a -s '-screen 0 1280x900x24' ./gradlew :sample:run --args="--screenshot=$PWD/screenshots/$view.png --view=$view"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: sample/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
  ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          set -o pipefail
          ./gradlew :sample:linkDebugFrameworkIosSimulatorArm64 --stacktrace 2>&1 | tee build-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-framework
          path: sample/build/bin/iosSimulatorArm64/debugFramework/
      - name: Report build failure on PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### CI diagnostics: iOS'; echo '```text'; tail -150 build-log.txt; echo '```'; } > diagnostic.md
          gh pr comment 1 --body-file diagnostic.md
